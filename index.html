<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Dungeon Crawler — Action Roguelike</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrap">
    <canvas id="game" width="960" height="640"></canvas>
    <div id="hud">
      <div id="hud-left">
        <div id="hp-bar"><div id="hp-fill"></div><span id="hp-text">100 / 100</span></div>
        <div id="stats">
          <span>FLOOR <b id="floor-num">1</b></span>
          <span>ROOMS <b id="room-cleared">0</b>/<b id="room-total">0</b></span>
          <span>DMG <b id="stat-dmg">10</b></span>
          <span>SPD <b id="stat-spd">3.0</b></span>
          <span>RoF <b id="stat-rof">2.5</b></span>
        </div>
      </div>
    </div>
    <div id="overlay" class="hidden">
      <div id="overlay-inner">
        <h1 id="overlay-title">DUNGEON CRAWLER</h1>
        <p id="overlay-text">WASD 이동 · 마우스 조준 · 좌클릭 발사<br>방의 적을 모두 처치하면 문이 열립니다</p>
        <button id="overlay-btn">시작</button>
      </div>
    </div>
    <div id="pickup-popup" class="hidden">
      <div id="pickup-inner">
        <h2 id="pickup-name">아이템</h2>
        <p id="pickup-desc">설명</p>
        <p class="hint">아무 키나 눌러 계속</p>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
